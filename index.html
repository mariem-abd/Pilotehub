<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, increment, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, OAuthProvider, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const app = initializeApp({
apiKey: "AIzaSyAz1tmNsEWKaCFwK8Ue-6OQMmsSgW08RDY",
authDomain: "pilotehub-617bf.firebaseapp.com",
projectId: "pilotehub-617bf",
storageBucket: "pilotehub-617bf.firebasestorage.app",
messagingSenderId: "664479873048",
appId: "1:664479873048:web:3d985beb36502ea032eb6d",
measurementId: "G-834HYGDPSQ",
});
const db = getFirestore(app);
const auth = getAuth(app);

// Saves every user in Firestore (users/{uid}) and bumps the counter only for brand-new accounts.
async function ensureUser(u, provider, countIfNew) {
try {
const ref = doc(db, "users", u.uid);
const snap = await getDoc(ref);
if (!snap.exists()) {
await setDoc(ref, { email: u.email || "", name: u.displayName || "", provider, createdAt: Date.now(), lastLogin: Date.now() });
if (countIfNew) await setDoc(doc(db, "stats", "users"), { count: increment(1) }, { merge: true });
} else {
await setDoc(ref, { lastLogin: Date.now() }, { merge: true });
}
} catch (e) { console.error("ensureUser:", e); }
}

getRedirectResult(auth).then((r) => { if (r && r.user) ensureUser(r.user, "social", true); }).catch(() => {});

window.PH = {
signUp: async (email, pw) => {
const c = await createUserWithEmailAndPassword(auth, email, pw);
await ensureUser(c.user, "password", true);
return c.user;
},
signIn: async (email, pw) => {
const c = await signInWithEmailAndPassword(auth, email, pw);
await ensureUser(c.user, "password", false); // older accounts were already counted at signup
return c.user;
},
social: async (name) => {
let p;
if (name === "google") p = new GoogleAuthProvider();
else { p = new OAuthProvider("apple.com"); p.addScope("email"); p.addScope("name"); }
try {
const c = await signInWithPopup(auth, p);
await ensureUser(c.user, name, true);
return c.user;
} catch (e) {
if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
await signInWithRedirect(auth, p);
return null;
}
throw e;
}
},
signOut: () => signOut(auth),
reset: (email) => sendPasswordResetEmail(auth, email),
onAuth: (cb) => onAuthStateChanged(auth, cb),
usersCount: async () => {
try { const s = await getDoc(doc(db, "stats", "users")); return s.exists() ? s.data().count || 0 : 0; }
catch (e) { console.error(e); return null; }
},
trackDownload: async () => {
try { await setDoc(doc(db, "downloads", "total"), { count: increment(1) }, { merge: true }); }
catch (e) { console.error(e); }
},
submitReview: async (stars, comment) => {
const u = auth.currentUser;
if (!u) throw new Error("not-signed-in");
await addDoc(collection(db, "reviews"), { uid: u.uid, email: u.email || u.displayName || "Student", stars, comment, createdAt: Date.now() });
},
getReviews: async () => {
try {
const s = await getDocs(query(collection(db, "reviews"), orderBy("createdAt", "desc"), limit(50)));
return s.docs.map((d) => d.data());
} catch (e) { console.error(e); return []; }
},
};
window.dispatchEvent(new Event("ph-ready"));
</script>

if (typeof gtag === "function") gtag("event", "download", { file_name: item.title });
const a = document.createElement("a");
a.href = url; a.download = url.split("/").pop(); a.target = "_blank"; a.rel = "noopener";
document.body.appendChild(a); a.click(); a.remove();
};
const locked = authChecked && !user;

<div style={{ position: "fixed", inset: 0, background: t.bg, zIndex: 400, display: "flex", flexDirection: "column", maxWidth: 430, margin: "0 auto" }}>

<div style={{ color: GRAY, fontSize: 11, marginTop: 2 }}>{locked ? "🔒 Locked" : "PDF Document"}</div>
</div>
{!locked && <button onClick={download} style={{ ...goldBtn, borderRadius: 10, padding: "8px 14px", fontSize: 13, flexShrink: 0 }}>⬇️ Download</button>}
</div>
<div style={{ flex: 1, display: "flex", flexDirection: "column", padding: 12, gap: 12, overflow: "hidden" }}>
{!authChecked ? (
<div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", color: t.sub }}>Loading…</div>
) : locked ? (
<div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: t.card, borderRadius: 20, padding: "40px 24px", textAlign: "center", border: `2px dashed ${GOLD}55` }}>
<div style={{ fontSize: 54, marginBottom: 14 }}>🔒</div>
<div style={{ color: t.tc, fontFamily: PF, fontSize: 18, fontWeight: 700, marginBottom: 8 }}>{item.title}</div>
<div style={{ color: GRAY, fontSize: 13, lineHeight: 1.7, marginBottom: 22 }}>Sign in or create a free account<br />to view and download this PDF.</div>
<button onClick={onSignIn} style={{ ...goldBtn, padding: "14px 28px", fontSize: 15 }}>Sign in / Sign up</button>
</div>
) : (
<>
<iframe src={url} title={item.title} style={{ flex: 1, width: "100%", border: "none", borderRadius: 14, boxShadow: "0 4px 24px rgba(0,0,0,0.15)", minHeight: 0, background: WHITE }} />
<div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
<button onClick={() => window.open(url, "_blank")} style={{ flex: 1, padding: 14, borderRadius: 14, background: t.card, border: `1px solid ${GOLD}66`, color: GOLD, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Open in browser</button>
<button onClick={download} style={{ ...goldBtn, flex: 1, padding: 14, borderRadius: 14, fontSize: 14 }}>⬇️ Download PDF</button>
</div>
</>
)}
</div>
</div>
);
}

function ReviewsModal({ dark, user, reviews, onClose, onSignIn, onPosted }) {
const t = theme(dark);
const [stars, setStars] = useState(5);
const [text, setText] = useState("");
const [busy, setBusy] = useState(false);
const [err, setErr] = useState("");
const avg = reviews.length ? reviews.reduce((a, r) => a + (r.stars || 0), 0) / reviews.length : 0;
const post = async () => {
if (!text.trim() || !user) return;
setBusy(true); setErr("");
try { await window.PH.submitReview(stars, text.trim()); setText(""); setStars(5); onPosted(); }
catch (e) { setErr("Could not post your review. Please try again."); }
setBusy(false);
};
return (
<div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 600, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
<div onClick={(e) => e.stopPropagation()} style={{ background: t.card, borderRadius: "20px 20px 0 0", padding: 24, maxWidth: 430, width: "100%", maxHeight: "85vh", overflowY: "auto", border: `1px solid ${GOLD}33`, borderBottom: "none" }}>
<div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
<h2 style={{ color: GOLD, fontFamily: PF }}>Community Reviews</h2>
<button onClick={onClose} style={{ background: "none", border: "none", color: t.sub, fontSize: 20, cursor: "pointer" }}>✕</button>
</div>
<div style={{ color: t.sub, fontSize: 13, marginBottom: 18 }}>
{reviews.length ? `${avg.toFixed(1)} ★ average from ${reviews.length} review${reviews.length === 1 ? "" : "s"}` : "Be the first to leave a review!"}
</div>
<div style={{ background: t.bg, borderRadius: 16, padding: 16, marginBottom: 20 }}>
{!user ? (
<div style={{ textAlign: "center" }}>
<div style={{ color: t.sub, fontSize: 13, marginBottom: 12 }}>🔒 Sign in to rate us and leave a comment.</div>
<button onClick={onSignIn} style={{ ...goldBtn, padding: "11px 22px", fontSize: 13 }}>Sign in / Sign up</button>
</div>
) : (
<>
<div style={{ color: t.sub, fontSize: 12, marginBottom: 8 }}>Posting as <b style={{ color: t.tc }}>{user.email || user.displayName}</b></div>
<div style={{ display: "flex", gap: 4, marginBottom: 10 }}>
{[1, 2, 3, 4, 5].map((n) => <span key={n} onClick={() => setStars(n)} style={{ fontSize: 26, cursor: "pointer", color: n <= stars ? GOLD : GRAY }}>★</span>)}
</div>
<textarea placeholder="Share your thoughts about Pilotehub+…" value={text} onChange={(e) => setText(e.target.value)} rows={3} style={inputStyle(t, dark, { background: t.card, fontSize: 13, resize: "vertical", fontFamily: "inherit" })} />
{err && <div style={{ color: "#E05C5C", fontSize: 12, marginTop: 6 }}>{err}</div>}
<button onClick={post} disabled={busy || !text.trim()} style={{ ...goldBtn, width: "100%", marginTop: 10, padding: "11px 22px", borderRadius: 10, fontSize: 13, opacity: busy || !text.trim() ? 0.6 : 1 }}>{busy ? "Posting…" : "Post Review"}</button>
</>
)}
</div>
<div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
{reviews.map((r, i) => (
<div key={i} style={{ background: t.bg, borderRadius: 14, padding: "14px 16px" }}>
<div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, gap: 8 }}>
<span style={{ color: t.tc, fontWeight: 700, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis" }}>{r.email && r.email !== "Unknown" ? r.email : "Anonymous"}</span>
<span style={{ color: GOLD, fontSize: 13, flexShrink: 0 }}>{"★".repeat(r.stars)}{"☆".repeat(5 - r.stars)}</span>
</div>
<div style={{ color: t.sub, fontSize: 13, lineHeight: 1.6 }}>{r.comment}</div>
</div>
))}
</div>
</div>
</div>
);
}

function App() {
const [started, setStarted] = useState(false);
const [dark, setDark] = useState(false);
const [level, setLevel] = useState(null);
const [grade, setGrade] = useState(null);
const [subj, setSubj] = useState(null);
const [ctype, setCtype] = useState(null);
const [openItem, setOpenItem] = useState(null);
const [showInfo, setShowInfo] = useState(false);
const [quote, setQuote] = useState(null);
const [user, setUser] = useState(null);
const [authChecked, setAuthChecked] = useState(false);
const [showAuth, setShowAuth] = useState(false);
const [authReason, setAuthReason] = useState("");
const [registeredCount, setRegisteredCount] = useState(null);
const [showReviews, setShowReviews] = useState(false);
const [reviews, setReviews] = useState([]);
const ready = useFirebaseReady();
const t = theme(dark);

const refreshCount = () => window.PH && window.PH.usersCount().then(setRegisteredCount);
const loadReviews = () => window.PH && window.PH.getReviews().then(setReviews);

useEffect(() => {
if (!ready) return;
if (!window.PH) { setAuthChecked(true); return; }
const unsub = window.PH.onAuth((u) => { setUser(u); setAuthChecked(true); refreshCount(); });
refreshCount(); loadReviews();
return unsub;
}, [ready]);

useEffect(() => {
const show = () => { setQuote(QUOTES[Math.floor(Math.random() * QUOTES.length)]); setTimeout(() => setQuote(null), 5000); };
show();
const iv = setInterval(show, 20 * 60 * 1000);
return () => clearInterval(iv);
}, []);

const askSignIn = (reason) => { setAuthReason(reason || ""); setShowAuth(true); };
const handleSignOut = async () => {
try { await window.PH.signOut(); } catch (e) {}
setUser(null); setOpenItem(null);
};

const goBack = () => { if (openItem) setOpenItem(null); else if (ctype) setCtype(null); else if (subj) setSubj(null); else if (grade) setGrade(null); else if (level) setLevel(null); };
const pickLevel = (v) => { setLevel(v); setGrade(null); setSubj(null); setCtype(null); setOpenItem(null); };
const pickGrade = (v) => { setGrade(v); setSubj(null); setCtype(null); };
const pickSubj = (v) => { setSubj(v); setCtype(null); };

const hasBack = !!(level || grade || subj || ctype);
const grades = level ? Object.keys(CONTENT[level]) : [];
const subjects = grade ? Object.keys(CONTENT[level][grade]) : [];
const items = level && grade && subj && ctype ? CONTENT[level][grade][subj][ctype] : [];
const ctypeIcon = (x) => (x === "courses" ? "📖" : x === "exercises" ? "✏️" : "📋");
const label = (txt, mb) => ({ color: GOLD, fontSize: 12, fontWeight: 700, letterSpacing: 2, marginBottom: mb ?? 4 });
const h1 = { color: t.tc, fontFamily: PF, fontSize: 24, fontWeight: 700, marginBottom: 20 };
const rowCard = { background: t.card, cursor: "pointer", border: `1px solid ${t.line}`, boxShadow: t.shadow };

if (!started) return <Splash onDone={() => setStarted(true)} />;

const authModal = showAuth && <AuthModal dark={dark} reason={authReason} onClose={() => setShowAuth(false)} />;

if (openItem)
return (
<>
<PDFViewer item={openItem} dark={dark} user={user} authChecked={authChecked} onBack={() => setOpenItem(null)} onSignIn={() => askSignIn("Create a free account or sign in to view and download this PDF.")} />
{authModal}
</>
);

return (
<div style={{ minHeight: "100vh", background: t.bg, transition: "background 0.3s" }}>
{quote && (
<div style={{ position: "fixed", bottom: 24, right: 16, zIndex: 300, background: `linear-gradient(135deg,${NAVY},${LNAV})`, border: `1px solid ${GOLD}44`, borderRadius: 16, padding: "12px 16px", maxWidth: 240, boxShadow: "0 8px 32px rgba(0,0,0,0.35)", animation: "slideIn 0.4s ease" }}>
<div style={{ color: WHITE, fontSize: 13, lineHeight: 1.5 }}>{quote}</div>
</div>
)}

{showInfo && (
<div onClick={() => setShowInfo(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 500, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
<div onClick={(e) => e.stopPropagation()} style={{ background: t.card, borderRadius: 20, padding: 28, maxWidth: 400, width: "100%", border: `1px solid ${GOLD}33` }}>
<h2 style={{ color: GOLD, fontFamily: PF, margin: "0 0 12px" }}>About Pilotehub+</h2>
<p style={{ color: t.tc, fontSize: 14, lineHeight: 1.8, margin: "0 0 12px" }}>Pilotehub+ is a free educational platform for students from 7th grade to Junior year. All courses, exercises, and exams — organized by grade and subject — in one place.</p>
<p style={{ color: t.sub, fontSize: 13 }}>No ads. No subscriptions. Forever free.</p>
<button onClick={() => setShowInfo(false)} style={{ marginTop: 18, padding: "11px 22px", background: GOLD, border: "none", borderRadius: 10, color: NAVY, fontWeight: 700, cursor: "pointer", fontSize: 14 }}>Got it!</button>
</div>
</div>
)}

{showReviews && <ReviewsModal dark={dark} user={user} reviews={reviews} onClose={() => setShowReviews(false)} onSignIn={() => askSignIn("Sign in to rate Pilotehub+ and leave a comment.")} onPosted={loadReviews} />}
{authModal}

{/* Top bar */}
<div style={{ background: dark ? `${NAVY}EE` : `${WHITE}EE`, backdropFilter: "blur(12px)", borderBottom: `1px solid ${t.line}`, padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 100 }}>
<div style={{ display: "flex", alignItems: "center", gap: 10 }}>
{hasBack && <button onClick={goBack} style={{ background: "none", border: "none", color: GOLD, fontSize: 22, cursor: "pointer", padding: "0 6px 0 0", lineHeight: 1 }}>←</button>}
<span style={{ fontFamily: PF, fontSize: 20, fontWeight: 700, color: t.tc }}>Pilotehub<span style={{ color: GOLD }}>+</span></span>
</div>
<div style={{ display: "flex", alignItems: "center", gap: 10 }}>
{user ? (
<button onClick={handleSignOut} title={user.email || ""} style={{ background: `${GOLD}22`, border: `1px solid ${GOLD}55`, borderRadius: 20, padding: "6px 12px", color: GOLD, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Sign Out</button>
) : (
<button onClick={() => askSignIn()} style={{ background: GRAD, border: "none", borderRadius: 20, padding: "6px 14px", color: NAVY, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>Sign In</button>
)}
<button onClick={() => setDark((d) => !d)} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer" }}>{dark ? "☀️" : "🌙"}</button>
</div>
</div>

{!level && (
<div onClick={() => setShowInfo(true)} style={{ background: `linear-gradient(135deg,${NAVY},${LNAV})`, padding: "14px 20px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
<div>
<div style={{ color: GOLD, fontSize: 12, fontWeight: 700, letterSpacing: 2 }}>ABOUT PILOTEHUB+</div>
<div style={{ color: "rgba(255,255,255,0.7)", fontSize: 13, marginTop: 2 }}>Tap to learn about the app →</div>
</div>
<span style={{ fontSize: 20 }}>ℹ️</span>
</div>
)}

<div style={{ padding: "24px 20px 40px" }}>
{!level && (
<>
<div style={{ fontSize: 22, fontWeight: 700, color: t.tc, fontFamily: PF, marginBottom: 6 }}>Welcome to Pilotehub+ 👋</div>
<div style={{ color: t.sub, fontSize: 14, marginBottom: user || !authChecked ? 28 : 14 }}>Select your school level to get started.</div>
{authChecked && !user && (
<div onClick={() => askSignIn()} style={{ background: `${GOLD}18`, border: `1px solid ${GOLD}55`, borderRadius: 14, padding: "12px 14px", marginBottom: 24, cursor: "pointer", color: t.tc, fontSize: 13, lineHeight: 1.5 }}>
🔒 Create a free account to view and download all PDFs. <span style={{ color: GOLD, fontWeight: 700 }}>Sign in →</span>
</div>
)}
<div style={{ fontSize: 13, color: t.sub, fontWeight: 700, letterSpacing: 2, marginBottom: 14 }}>CHOOSE YOUR LEVEL</div>
<div style={{ display: "flex", gap: 14 }}>
{["Middle School", "High School"].map((lv, i) => (
<div key={lv} onClick={() => pickLevel(lv)} style={{ flex: 1, borderRadius: 20, cursor: "pointer", background: i === 0 ? "linear-gradient(135deg,#1A3158,#0A1628)" : "linear-gradient(135deg,#2A1A10,#1A0A05)", border: `1px solid ${GOLD}33`, padding: "24px 16px", position: "relative", boxShadow: "0 4px 20px rgba(0,0,0,0.2)" }}>
<div style={{ fontSize: 32, marginBottom: 10 }}>{i === 0 ? "🏫" : "🎓"}</div>
<div style={{ color: WHITE, fontWeight: 700, fontSize: 16, fontFamily: PF }}>{lv}</div>
<div style={{ color: "rgba(255,255,255,0.5)", fontSize: 12, marginTop: 4 }}>{i === 0 ? "Grades 7–9" : "Freshman–Junior"}</div>
<div style={{ position: "absolute", bottom: 14, right: 16, color: GOLD, fontSize: 20 }}>→</div>
</div>
))}
</div>

<div style={{ fontSize: 13, color: t.sub, fontWeight: 700, letterSpacing: 2, margin: "32px 0 14px" }}>OUR COMMUNITY</div>
<div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 20 }}>
{[
["👥", "Registered Users", registeredCount === null ? "—" : registeredCount],
["📚", "Resources Available", RESOURCES_COUNT],
["🏫", "Schools Represented", SCHOOLS_COUNT],
["🤝", "Team Members", TEAM_MEMBERS_COUNT],
].map(([icon, lab, val]) => (
<div key={lab} style={{ background: t.card, borderRadius: 16, padding: "16px 14px", border: `1px solid ${t.line}`, boxShadow: t.shadow }}>
<div style={{ fontSize: 20, marginBottom: 6 }}>{icon}</div>
<div style={{ color: GOLD, fontFamily: PF, fontSize: 22, fontWeight: 700 }}>{val}</div>
<div style={{ color: t.sub, fontSize: 11, marginTop: 2 }}>{lab}</div>
</div>
))}
</div>

<div onClick={() => window.open(JOIN_FORM_LINK, "_blank")} style={{ background: `linear-gradient(135deg,${NAVY},${LNAV})`, borderRadius: 18, padding: "20px 18px", cursor: "pointer", border: `1px solid ${GOLD}44`, marginBottom: 14, boxShadow: "0 4px 20px rgba(0,0,0,0.2)" }}>
<div style={{ color: GOLD, fontSize: 12, fontWeight: 700, letterSpacing: 2, marginBottom: 6 }}>JOIN US</div>
<div style={{ color: WHITE, fontSize: 15, lineHeight: 1.6, marginBottom: 12 }}>Help us improve access to education in Tunisia — become a contributor to Pilotehub+.</div>
<div style={{ color: GOLD, fontWeight: 700, fontSize: 13 }}>Apply now →</div>
</div>

<div onClick={() => { loadReviews(); setShowReviews(true); }} style={{ ...rowCard, borderRadius: 16, padding: "16px 18px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
<div>
<div style={{ color: t.tc, fontWeight: 700, fontSize: 15, fontFamily: PF }}>⭐ Reviews & Comments</div>
<div style={{ color: t.sub, fontSize: 12, marginTop: 4 }}>
{reviews.length ? `${(reviews.reduce((a, r) => a + (r.stars || 0), 0) / reviews.length).toFixed(1)} ★ · ${reviews.length} review${reviews.length === 1 ? "" : "s"}` : "Rate us & share your thoughts"}
</div>
</div>
<span style={{ color: GOLD, fontSize: 22 }}>→</span>
</div>
</>
)}

{level && !grade && (
<>
<div style={label()}>{level.toUpperCase()}</div>
<div style={h1}>Select Grade</div>
<div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
{grades.map((g) => (
<div key={g} onClick={() => pickGrade(g)} style={{ ...rowCard, borderRadius: 18, padding: 20, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
<div>
<div style={{ color: t.tc, fontWeight: 700, fontSize: 17, fontFamily: PF }}>{g}</div>
<div style={{ color: t.sub, fontSize: 12, marginTop: 4 }}>{Object.keys(CONTENT[level][g]).length} subjects</div>
</div>
<span style={{ color: GOLD, fontSize: 22 }}>→</span>
</div>
))}
</div>
</>
)}

{level && grade && !subj && (
<>
<div style={label()}>{grade.toUpperCase()}</div>
<div style={h1}>Select Subject</div>
<div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
{subjects.map((s) => (
<div key={s} onClick={() => pickSubj(s)} style={{ ...rowCard, borderRadius: 14, padding: "16px 14px", display: "flex", alignItems: "center", gap: 10 }}>
<span style={{ fontSize: 22 }}>{SICO[s] || "📚"}</span>
<span style={{ color: t.tc, fontSize: 13, fontWeight: 600 }}>{s}</span>
</div>
))}
</div>
</>
)}

{level && grade && subj && !ctype && (
<>
<div style={label()}>{subj.toUpperCase()}</div>
<div style={h1}>What to study?</div>
<div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
{[["courses", "📖", "Courses", "Lessons & resumes"], ["exercises", "✏️", "Exercises", "Practice problems"], ["exams", "📋", "Exams", "Past & mock exams"]].map(([type, icon, lab, desc], i) => (
<div key={type} onClick={() => setCtype(type)} style={{ ...rowCard, borderRadius: 18, padding: "22px 16px", gridColumn: i === 2 ? "span 2" : "auto" }}>
<div style={{ fontSize: 32, marginBottom: 10 }}>{icon}</div>
<div style={{ color: t.tc, fontWeight: 700, fontSize: 16, fontFamily: PF }}>{lab}</div>
<div style={{ color: t.sub, fontSize: 12, marginTop: 4 }}>{desc}</div>
</div>
))}
</div>
</>
)}

{level && grade && subj && ctype && (
<>
<div style={label()}>{subj.toUpperCase()} · {grade.toUpperCase()}</div>
<div style={h1}>{ctype === "courses" ? "Courses" : ctype === "exercises" ? "Exercises" : "Exams"}</div>
{items.length === 0 ? (
<div style={{ background: t.card, borderRadius: 20, padding: "44px 24px", textAlign: "center", border: `2px dashed ${dark ? "rgba(255,255,255,0.08)" : "rgba(10,22,40,0.1)"}` }}>
<div style={{ fontSize: 40, marginBottom: 12 }}>{ctypeIcon(ctype)}</div>
<div style={{ color: t.tc, fontFamily: PF, fontSize: 16, fontWeight: 700, marginBottom: 8 }}>No {ctype} yet</div>
<div style={{ color: GRAY, fontSize: 13, lineHeight: 1.7 }}>Content coming soon.<br />Check back later!</div>
</div>
) : (
<div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
{items.map((item, i) => {
const lockedBadge = item.pdf && authChecked && !user;
return (
<div key={i} onClick={() => setOpenItem(item)} style={{ ...rowCard, borderRadius: 14, padding: "16px 18px", display: "flex", alignItems: "center", gap: 14, animation: `fadeUp 0.35s ease ${i * 0.06}s both` }}>
<div style={{ width: 44, height: 44, borderRadius: 12, flexShrink: 0, background: `linear-gradient(135deg,${NAVY},${LNAV})`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>{lockedBadge ? "🔒" : ctypeIcon(ctype)}</div>
<div style={{ flex: 1, minWidth: 0 }}>
<div style={{ color: t.tc, fontWeight: 600, fontSize: 14, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.title}</div>
<div style={{ marginTop: 4 }}>
<span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 20, background: item.pdf ? `${GOLD}18` : "rgba(150,150,150,0.1)", border: `1px solid ${item.pdf ? GOLD + "44" : "rgba(150,150,150,0.2)"}`, color: item.pdf ? GOLD : GRAY, fontWeight: 700 }}>
{!item.pdf ? "📄 Coming soon" : lockedBadge ? "🔒 Sign in to view" : "📄 PDF ready"}
</span>
</div>
</div>
<span style={{ color: GOLD, fontSize: 18, flexShrink: 0 }}>→</span>
</div>
);
})}
</div>
)}
</>
)}
</div>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
