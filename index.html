      // Counts every resource (course/exercise/exam) that has a real PDF attached.
      function countResources(content) {
        let total = 0;
        Object.values(content).forEach((levelObj) => {
          Object.values(levelObj).forEach((gradeObj) => {
            Object.values(gradeObj).forEach((subjObj) => {
              ["courses", "exercises", "exams"].forEach((t) => {
                (subjObj[t] || []).forEach((item) => {
                  if (item.pdf) total++;
                });
              });
            });
          });
        });
        return total;

          if (typeof gtag === "function") {
            gtag("event", "download", { file_name: item.title });
          }
          // Open in new tab — works on all devices including iPhone
          window.open(item.pdf, "_blank");

                    }}
                  >
                    {item.title}
                  </div>
                  <div style={{ color: GRAY, fontSize: 13, lineHeight: 1.8 }}>

                    <br />

                  </div>
                </div>
              )}
              <button
                onClick={download}
                style={{
                  width: "100%",
                  padding: "14px",
                  borderRadius: 14,
                  background: `linear-gradient(135deg,${GOLD},#A8822A)`,
                  border: "none",
                  color: NAVY,
                  fontWeight: 700,
                  fontSize: 15,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 8,
                  boxShadow: `0 4px 20px rgba(201,168,76,0.3)`,

      }

      function App() {
        const [started, setStarted] = useState(false);
        const [dark, setDark] = useState(false);
        const [level, setLevel] = useState(null);
        const [grade, setGrade] = useState(null);
        const [subj, setSubj] = useState(null);
        const [ctype, setCtype] = useState(null);
        const [openItem, setOpenItem] = useState(null);
        const [showInfo, setShowInfo] = useState(false);
        const [quote, setQuote] = useState(null);

        // ---- Auth (email registration/login) ----
        const [user, setUser] = useState(null);
        const [authChecked, setAuthChecked] = useState(false);
        const [authMode, setAuthMode] = useState("login"); // "signup" | "login"
        const [authEmail, setAuthEmail] = useState("");
        const [authPassword, setAuthPassword] = useState("");
        const [authError, setAuthError] = useState("");
        const [showPassword, setShowPassword] = useState(false);
        const [authLoading, setAuthLoading] = useState(false);
        const [registeredCount, setRegisteredCount] = useState(null);

        // ---- Reviews (stars + comments) ----
        const [showReviews, setShowReviews] = useState(false);
        const [reviews, setReviews] = useState([]);
        const [reviewName, setReviewName] = useState("");
        const [reviewStars, setReviewStars] = useState(5);
        const [reviewText, setReviewText] = useState("");
        const [reviewLoading, setReviewLoading] = useState(false);

        useEffect(() => {
          if (typeof window.pilotehubOnAuthChange === "function") {
            const unsub = window.pilotehubOnAuthChange((u) => {
              setUser(u);
              setAuthChecked(true);
            });
            return unsub;
          } else {
            // Firebase not available for some reason — don't block forever.
            setAuthChecked(true);
          }
        }, []);

        useEffect(() => {
          if (typeof window.pilotehubGetRegisteredUsersCount === "function") {
            window.pilotehubGetRegisteredUsersCount().then(setRegisteredCount);
          }
        }, []);

        const loadReviews = () => {
          if (typeof window.pilotehubGetReviews === "function") {
            window.pilotehubGetReviews().then(setReviews);
          }
        };
        useEffect(() => {
          loadReviews();
        }, []);

        const avgRating = reviews.length
          ? reviews.reduce((a, r) => a + (r.stars || 0), 0) / reviews.length
          : 0;

        const handleAuthSubmit = async () => {
          setAuthError("");
          if (!authEmail || !authPassword) {
            setAuthError("Please fill in both fields.");
            return;
          }
          setAuthLoading(true);
          try {
            if (authMode === "signup") {
              const u = await window.pilotehubSignUp(authEmail, authPassword);
              setUser(u);
              window
                .pilotehubGetRegisteredUsersCount()
                .then(setRegisteredCount);
            } else {
              const u = await window.pilotehubSignIn(authEmail, authPassword);
              setUser(u);
            }
            setShowAuth(false);
            setAuthEmail("");
            setAuthPassword("");
          } catch (err) {
            if (err.code === "auth/invalid-credential") {
              setAuthError("Incorrect email or password.");
            } else if (err.code === "auth/email-already-in-use") {
              setAuthError("This email already has an account. Please log in.");
            } else if (err.code === "auth/weak-password") {
              setAuthError("Password must contain at least 6 characters.");
            } else if (err.code === "auth/invalid-email") {
              setAuthError("Please enter a valid email address.");
            } else {
              setAuthError("Something went wrong. Please try again.");
            }
          }
          setAuthLoading(false);
        };

        const handleSignOut = async () => {
          try {
            await window.pilotehubSignOut();
          } catch (err) {}
          setUser(null);
        };

        const handleSubmitReview = async () => {
          if (!reviewText.trim()) return;
          setReviewLoading(true);
          try {
            await window.pilotehubSubmitReview(reviewStars, reviewText.trim());
            setReviewName("");
            setReviewText("");
            setReviewStars(5);
            loadReviews();
          } catch (err) {}
          setReviewLoading(false);
        };

        const bg = dark ? "#080F1C" : SOFT,
          card = dark ? NAVY2 : WHITE,
          tc = dark ? WHITE : NAVY,
          sub = dark ? "#8A99B0" : "#5A6A80";

        useEffect(() => {
          const show = () => {
            setQuote(QUOTES[Math.floor(Math.random() * QUOTES.length)]);
            setTimeout(() => setQuote(null), 5000);
          };
          show();
          const iv = setInterval(show, 20 * 60 * 1000);
          return () => clearInterval(iv);
        }, []);

        const goBack = () => {
          if (openItem) {
            setOpenItem(null);
            return;
          }
          if (ctype) {
            setCtype(null);
            return;
          }
          if (subj) {
            setSubj(null);
            return;
          }
          if (grade) {
            setGrade(null);
            return;
          }
          if (level) {
            setLevel(null);
          }
        };

        const setLevelSafe = (v) => {
          setLevel(v);
          setGrade(null);
          setSubj(null);
          setCtype(null);
          setOpenItem(null);
        };
        const setGradeSafe = (v) => {
          setGrade(v);
          setSubj(null);
          setCtype(null);
          setOpenItem(null);
        };
        const setSubjSafe = (v) => {
          setSubj(v);
          setCtype(null);
          setOpenItem(null);
        };
        const setCtypeSafe = (v) => {
          setCtype(v);
          setOpenItem(null);
        };

        const hasBack = !!(level || grade || subj || ctype || openItem);
        const grades = level ? Object.keys(CONTENT[level]) : [];
        const subjects = grade ? Object.keys(CONTENT[level][grade]) : [];
        const items =
          level && grade && subj && ctype
            ? CONTENT[level][grade][subj][ctype]
            : [];
        const ctypeIcon = (t) =>
          t === "courses" ? "📖" : t === "exercises" ? "✏️" : "📋";

        if (!started) return <Splash onDone={() => setStarted(true)} />;

        if (!authChecked) {

              <div style={{ color: sub, fontSize: 14 }}>Loading…</div>

        if (!user) {

                background: bg,

                      borderRadius: 10,

              >

                  <button

                      cursor: "pointer",

            {showReviews && (
              <div

                        fontFamily: "'Playfair Display',serif",

                    <button

                      style={{

                    >
                      ✕
                    </button>
                  </div>
                  <div style={{ color: sub, fontSize: 13, marginBottom: 18 }}>
                    {reviews.length > 0
                      ? `${avgRating.toFixed(1)} ★ average from ${

                  </div>

                  <div
                    style={{

                  >

                      value={reviewName}
                      onChange={(e) => setReviewName(e.target.value)}
                      style={{

                        padding: "10px 12px",
                        borderRadius: 10,
                        border: `1px solid ${
                          dark
                            ? "rgba(255,255,255,0.15)"
                            : "rgba(10,22,40,0.15)"
                        }`,
                        background: card,
                        color: tc,
                        fontSize: 13,

                        outline: "none",
                      }}
                    />
                    <div style={{ display: "flex", gap: 4, marginBottom: 10 }}>
                      {[1, 2, 3, 4, 5].map((n) => (

                    </div>
                    <textarea

    <script>
      // PDF download click tracker for Google Analytics
      window.addEventListener(
        "click",
        function (e) {
          const path = e.composedPath ? e.composedPath() : [];
          for (let el of path) {
            if (el && el.tagName === "A") {
              const href = el.getAttribute("href");
              if (href && href.includes(".pdf")) {
                if (typeof gtag === "function") {
                  gtag("event", "download", {
                    file_name: href.split("/").pop(),
                  });
                }
                break;
              }
            }
          }
        },
        true
      );
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        updateDoc,
        increment,
        collection,
        addDoc,
        getDocs,
        query,
        orderBy,
        limit,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
        sendPasswordResetEmail,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAz1tmNsEWKaCFwK8Ue-6OQMmsSgW08RDY",
        authDomain: "pilotehub-617bf.firebaseapp.com",
        projectId: "pilotehub-617bf",
        storageBucket: "pilotehub-617bf.firebasestorage.app",
        messagingSenderId: "664479873048",
        appId: "1:664479873048:web:3d985beb36502ea032eb6d",
        measurementId: "G-834HYGDPSQ",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.trackDownload = async function () {
        try {
          const ref = doc(db, "downloads", "total");
          await updateDoc(ref, { count: increment(1) });
          console.log("Download counted!");
        } catch (err) {
          console.error("Firebase error:", err);
        }
      };

      // ---- User registration (email/password via Firebase Auth) ----
      window.pilotehubSignUp = async function (email, password) {
        const cred = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );
        // Bump the cumulative registered-users counter (creates the doc if missing)
        await setDoc(
          doc(db, "stats", "users"),
          { count: increment(1) },
          { merge: true }
        );
        return cred.user;
      };

      window.pilotehubSignIn = async function (email, password) {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        return cred.user;
      };

      window.pilotehubSignOut = async function () {
        await signOut(auth);
      };
      window.pilotehubResetPassword = async function (email) {
        await sendPasswordResetEmail(auth, email);
      };

      window.pilotehubOnAuthChange = function (callback) {
        return onAuthStateChanged(auth, callback);
      };

      window.pilotehubGetRegisteredUsersCount = async function () {
        try {
          const snap = await getDoc(doc(db, "stats", "users"));
          return snap.exists() ? snap.data().count || 0 : 0;
        } catch (err) {
          console.error("Firebase error:", err);
          return null;
        }
      };

      // ---- Reviews / comments with star ratings ----
      window.pilotehubSubmitReview = async function (stars, comment) {
        const user = auth.currentUser;

        await addDoc(collection(db, "reviews"), {
          email: user ? user.email : "Unknown",
          stars,
          comment,
          createdAt: Date.now(),
        });
      };
      window.pilotehubGetReviews = async function () {
        try {
          const q = query(
            collection(db, "reviews"),
            orderBy("createdAt", "desc"),
            limit(50)
          );
          const snap = await getDocs(q);
          return snap.docs.map((d) => d.data());
        } catch (err) {
          console.error("Firebase error:", err);
          return [];
        }
      };
    </script>
